<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="SwitchYard animated assembly banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b14"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B39DDB"/>
      <stop offset="1" stop-color="#6B3FA0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg)" stroke="#6B3FA0" stroke-width="2"/>

  <!-- faint hex dump background -->
  <g font-family="Courier New, Consolas, monospace" font-size="11" fill="#2a2142">
    <text x="24" y="58">0100: EB 2A 90 05 03 C4 C4 C4  C4 C4 31 00 07 0E FF FF  .*..............</text>
    <text x="24" y="72">0110: B8 00 B8 8E C0 31 FF B8  20 07 B9 D0 07 FC F3 AB  .....1.. .......</text>
    <text x="520" y="58">B800:0000  20 07 20 07 20 07 20 07</text>
    <text x="520" y="72">INT 08h  INT 09h  INT 16h  INT 21h</text>
  </g>

  <!-- prompt line -->
  <g font-family="Courier New, Consolas, monospace" font-size="15">
    <text x="30" y="108" fill="#9B86CF">C:\&gt; nasm train.asm -o train.com</text>
    <text x="30" y="130" fill="#B39DDB">C:\&gt; step1<tspan fill="#E6C84A"> </tspan></text>
    <rect x="123" y="117" width="9" height="15" fill="#E6C84A">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title -->
  <text x="450" y="205" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-size="76" font-weight="bold" letter-spacing="6" fill="url(#title)" filter="url(#glow)">SWITCHYARD</text>
  <text x="450" y="236" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-size="14" letter-spacing="3" fill="#9B86CF">16-BIT x86 ASSEMBLY  ·  NASM  ·  DOS  ·  DIRECT VIDEO MEMORY</text>

  <!-- track -->
  <g stroke="#6B3FA0" stroke-width="3" fill="none">
    <line x1="40" y1="272" x2="840" y2="272"/>
  </g>
  <g font-family="Courier New, Consolas, monospace" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="30" y="277" fill="#4DD0E1">&gt;</text>
    <g fill="#0d0b14" stroke="#E6C84A" stroke-width="2">
      <rect x="187" y="259" width="26" height="26" rx="3"/>
      <rect x="337" y="259" width="26" height="26" rx="3"/>
      <rect x="487" y="259" width="26" height="26" rx="3"/>
      <rect x="637" y="259" width="26" height="26" rx="3"/>
    </g>
    <g fill="#E6C84A">
      <text x="200" y="278">1</text>
      <text x="350" y="278">2</text>
      <text x="500" y="278">3</text>
      <text x="650" y="278">4</text>
    </g>
    <rect x="848" y="259" width="26" height="26" rx="3" fill="#0d0b14" stroke="#66BB6A" stroke-width="2"/>
    <text x="861" y="278" fill="#66BB6A">C</text>
  </g>

  <!-- the train (destination letter C) -->
  <g>
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#6B3FA0" stroke="#B39DDB" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-size="15" font-weight="bold" fill="#ffffff">C</text>
    <animateMotion path="M60,272 H836" dur="7s" repeatCount="indefinite"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
